aid: ostrom
name: Ostrom
description: >-
  Ostrom is a fully digital green-energy provider based in Berlin, Germany, offering
  variable, fixed, and dynamic electricity tariffs managed entirely through a mobile
  app, with smart-meter integration, device control, EV-charging optimization, and a
  NeoGrid virtual power plant. Its developer API lets Ostrom customers and partners
  integrate with the smart energy-management platform: OAuth2-secured REST endpoints
  for user data, orders, contracts, smart-meter energy consumption, day-ahead EEX
  spot prices, product pricing, and partner webhooks.
